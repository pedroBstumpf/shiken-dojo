# Pipeline de cada PR e push (docs/BACKEND.md §20): lint, tipos, testes, build e dependências.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://app_runtime:runtime-ci@localhost:5432/shiken_dojo_test
      TEST_MIGRATION_DATABASE_URL: postgres://app_migrator:migrator-ci@localhost:5432/shiken_dojo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Papéis de menor privilégio e banco de testes
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_migrator LOGIN PASSWORD 'migrator-ci'" \
            -c "CREATE ROLE app_runtime LOGIN PASSWORD 'runtime-ci'" \
            -c "CREATE DATABASE shiken_dojo_test OWNER app_migrator" \
            -c "REVOKE ALL ON DATABASE shiken_dojo_test FROM PUBLIC" \
            -c "GRANT CONNECT, TEMPORARY ON DATABASE shiken_dojo_test TO app_runtime"
          psql -h localhost -U postgres -d shiken_dojo_test -v ON_ERROR_STOP=1 \
            -c "REVOKE ALL ON SCHEMA public FROM PUBLIC"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Dependências sem vulnerabilidades altas ou críticas
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Dependências sem vulnerabilidades altas ou críticas
        run: npm audit --omit=dev --audit-level=high
